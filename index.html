<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Аномалия: Три Пути — онлайн</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
/* ===== БЛОК 1. ВНЕШНИЙ ВИД (CSS) =====
   Цвета лежат в переменных (--bg, --pn...), поэтому игра сама
   подстраивается под светлую и тёмную тему телефона. */
:root{--bg:#f1efe9;--pn:#fff;--tx:#1b1b1f;--ln:#d4d0c6;--bt:#e9e6dd;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--pn:#161a22;--tx:#e9e9ef;--ln:#2a2f3b;--bt:#222735}}
:root[data-theme="dark"]{--bg:#0b0d12;--pn:#161a22;--tx:#e9e9ef;--ln:#2a2f3b;--bt:#222735}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{touch-action:manipulation;margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;user-select:none}
#app{display:flex;flex-direction:column;align-items:center;height:100%}
#hud{width:100%;box-sizing:border-box;min-height:42px;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--ln);font-size:12px}
canvas{background:#10131a;touch-action:none}  /* touch-action: страница не прокручивается при игре */
#pn{width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--pn);border-top:1px solid var(--ln)}
#buy,#ctl{display:flex;gap:6px}
#buy button{flex:1}
#ctl button{flex:1;padding:8px 2px;font-size:11px}
button{touch-action:manipulation;font:inherit;color:var(--tx);background:var(--bt);border:1px solid var(--ln);border-radius:10px;padding:8px 6px}
button:disabled{opacity:.4}
#ov{position:fixed;inset:0;background:rgba(8,10,14,.92);display:flex;align-items:center;justify-content:center;overflow:auto}
.box{max-width:420px;padding:16px;color:#e9e9ef}
.box h2{margin:0 0 8px}.box p{font-size:13px;opacity:.85}
.fc{display:block;width:100%;margin:8px 0;text-align:left;border-width:2px;background:#161a22;color:#e9e9ef}
</style>
</head>
<body>
<!-- ===== БЛОК 2. КАРКАС СТРАНИЦЫ (HTML) =====
     hud = полоса сверху (ресурсы, время); cv = поле боя;
     buy = кнопки найма; all = «Все войска»; ov = меню и экран итогов -->
<div id="app">
 <div id="hud"></div>
 <canvas id="cv"></canvas>
 <div id="pn"><div id="buy"></div><div id="ctl"><button id="up">База ↑</button><button id="bld">Здание</button><button id="fuse" style="display:none">Сращивание</button><button id="home">К базе</button><button id="all">Все войска</button></div></div>
</div>
<div id="ov"></div>

<script>
/* ===== БЛОК 3. ДАННЫЕ ФРАКЦИЙ =====
   Здесь живёт весь баланс. Меняй числа и смотри, как меняется игра.
   c = цвет; start = стартовый ресурс; base = доход от базы в секунду;
   node = доход за каждую захваченную точку; curve(t) = множитель дохода
   от времени t (в секундах) — именно он делает «окна силы»:
   техно растёт к концу, био падает, маги не зависят от времени.
   u = список юнитов: cost = цена, hp = здоровье, dmg = урон за удар,
   range = дальность, speed = скорость, rate = секунд между ударами.
   Особенности: count = сколько юнитов за раз, zap = оглушение (сек), hack = угон вражеского юнита на N сек, grow = секунд «вызревания» в коконе, ritual = только через ритуал, ult = ультимативный юнит (нужна база ур.2, один на игрока), bld = здание фракции на точке (турель стреляет, гнездо рождает рой, храм даёт +6 дохода и ускоряет ритуал),
   splash = радиус урона по площади, life = время жизни (сек). */
const F={
 techno:{n:'Нео-Сема',c:'#38bdf8',res:'Энергия',start:100,base:5,node:3,
  curve:t=>Math.min(1.2,.7+t/150),
  bld:{k:'tur',n:'Турель',s:'Турель',cost:90,hp:320,dmg:16,range:150,rate:1},
  info:'Дальний бой и быстро растущий доход, но юниты дорогие. Здание: турель. Хакеры угоняют вражеских юнитов на 10 с.',
  u:[{n:'Дрон',cost:32,hp:40,dmg:6,range:110,speed:75,rate:.8},
     {n:'Киборг',cost:60,hp:100,dmg:12,range:120,speed:60,rate:1},
     {n:'Хакер',cost:80,hp:60,dmg:4,range:150,speed:60,rate:5,hack:10},
     {n:'Мех-Титан',cost:240,hp:420,dmg:30,range:140,speed:45,rate:1.2,ult:1}]},
 bio:{n:'Био-Генезис',c:'#84cc16',res:'Биомасса',start:160,base:6,node:2,regen:.05,slime:2.5,grow:3,
  curve:t=>Math.max(.7,1.4-t/300),
  bld:{k:'nest',n:'Гнездо',s:'Гнездо',cost:80,hp:260,dmg:0,range:0,rate:1,spawn:10},
  info:'Дешёвый рой, юниты вызревают в коконах. Лечатся тем быстрее, чем дольше бой, а на своей слизи (у базы и захваченных точек) — ещё быстрее. Кнопка «Сращивание» (выбери двоих) делает гибрида. Доход падает, зато армия живучая. Здание: гнездо само рождает рой каждые 10 с (зелёное кольцо — до следующего).',
  u:[{n:'Рой ×2',cost:20,count:2,hp:26,dmg:5,range:16,speed:115,rate:.7},
     {n:'Хищник',cost:45,hp:90,dmg:12,range:18,speed:100,rate:.9},
     {n:'Бугай',cost:90,hp:260,dmg:20,range:20,speed:55,rate:1.1},
     {n:'Левиафан',cost:240,hp:560,dmg:26,range:24,speed:50,rate:1.1,splash:45,ult:1}]},
 magic:{n:'Адепты Астрала',c:'#c084fc',res:'Эссенция',start:120,base:2,node:6,
  curve:()=>1,
  bld:{k:'sanct',n:'Святилище',s:'Храм',cost:90,hp:280,dmg:0,range:0,rate:1},
  info:'Дух призывается ритуалом: поставь Послушника на свою точку и жми «Дух»: 5 с он колдует (убьют — сорвано). Доход почти только с точек. Здание: храм, ускоряет ритуал и даёт эссенцию.',
  u:[{n:'Послушник',cost:40,hp:55,dmg:8,range:100,speed:70,rate:1},
     {n:'Элементаль',cost:90,hp:150,dmg:16,range:70,speed:55,rate:1.2,splash:45},
     {n:'Дух 30с',cost:120,hp:90,dmg:34,range:130,speed:85,rate:1,life:30,ritual:1},
     {n:'Аватар',cost:240,hp:240,dmg:38,range:120,speed:55,rate:1.2,splash:60,ritual:1,ult:1}]}
};

/* ===== БЛОК 4. ПЕРЕМЕННЫЕ ИГРЫ =====
   W,H = размер поля; P = телефон в вертикальном положении;
   units = все бойцы и обе базы (индексы 0 и 1 — базы игрока и бота);
   nodes = точки силы; fx = короткие эффекты (выстрелы, метки);
   res = ресурс [игрок, бот]; fac = фракции [игрок, бот];
   core = сколько секунд каждый держит Ядро; running = идёт ли бой. */
const $=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d');
let W,H,P,units,nodes,fx,res,fac,time,core,running=false,bot,cat,diff=1,ttl='',hint='',hintT=0;
/* Онлайн: online = идёт ли матч по сети; me = моя команда (0 хозяин, 1 гость); peer/conn = связь;
   mode = что выбирает игрок в меню (solo/host/join); uid = счётчик номеров юнитов;
   selIds = номера выбранных мной юнитов (нужны гостю). */
let online=0,me=0,peer,conn,mode='solo',uid=0,snapT=0,lvl=[1,1],buildMode=false,fog=1,VS=null;
const UP=180;   /* lvl[t] = уровень базы команды t (1 или 2); UP = цена улучшения */const selIds=new Set();
/* Камера: cam.x,cam.y = левый верхний угол видимой части мира, cam.z = масштаб;
   DPR = плотность пикселей экрана (для чёткой картинки).
   bots[t] = «мозг» бота команды t; botT[t]=1 — командой t управляет бот. */
const cam={x:0,y:0,z:1},DPR=Math.min(2,window.devicePixelRatio||1);
let bots=[{buy:3,order:5},{buy:3,order:5}],botT=[0,1];
const guest=()=>online&&me===1;                                   // я — гость?
const send=m=>{try{conn&&conn.open&&conn.send(m)}catch(e){}};     // отправить сообщение сопернику
const say=s=>{hint=s;hintT=4};   // say(): короткое сообщение на поле на 4 секунды
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const fmt=s=>(s/60|0)+':'+String(s%60|0).padStart(2,'0');

/* ===== БЛОК 5. МЕНЮ И КОНЕЦ ИГРЫ =====
   Показывает экран выбора фракции. После боя вызывается снова с итогом. */
function menu(title){
 if(title!==undefined)ttl=title;
 $('ov').style.display='flex';
 $('ov').innerHTML='<div class="box"><h2>'+(ttl||'Аномалия: Три Пути')+'</h2>'+
 '<p>Бой против бота или онлайн 1v1 с другом. Нажми на своего бойца — он выберется, или протяни палец по полю — рамка выберет всех внутри. Нажми на землю — пойдёт туда, на врага — атакует. '+
 'Стой на точках, чтобы захватить: они дают ресурс. Ядро в центре открывается на 4-й минуте: удержи его 120 секунд или разрушь базу врага. Двумя пальцами двигай и приближай карту. Кнопка «База ↑» открывает ультимативного юнита, кнопка со зданием строит его на твоей захваченной точке. Каждые 2,5 минуты — катаклизм.</p>'+
 '<p>Сложность бота: '+['Лёгкая','Нормальная','Сложная'].map((n,i)=>'<button onclick="diff='+i+';menu()" style="padding:6px 10px;'+(diff==i?'border:2px solid #ffd54a':'')+'">'+n+'</button>').join(' ')+'</p>'+
 '<p>Онлайн 1v1: <button onclick="setMode(\'host\')">Создать комнату</button> <button onclick="setMode(\'join\')">Войти по коду</button></p>'+
 '<p><button onclick="simTest(10)">Тест баланса: боты играют сами</button></p>'+
 '<p><button onclick="fog=!fog;menu()">Туман войны: '+(fog?'включён':'выключен')+'</button></p>'+
 (mode!=='solo'?'<p><b>'+(mode=='host'?'Создаёшь комнату':'Входишь в комнату '+joinCode)+' — выбери фракцию</b> <button onclick="mode=\'solo\';menu()">отмена</button></p>':'')+
 Object.keys(F).map(k=>'<button class="fc" style="border-color:'+F[k].c+'" onclick="pick(\''+k+'\')"><b>'+F[k].n+'</b><br>'+F[k].info+'</button>').join('')+'</div>';
}
function end(win,why){running=false;mode='solo';if(online){online=0;setTimeout(()=>{try{peer.destroy()}catch(e){}peer=conn=null},1500)}menu((win?'ПОБЕДА! ':'ПОРАЖЕНИЕ. ')+why+' ['+F[fac[0]].n+' vs '+F[fac[1]].n+', '+fmt(time)+']')}

/* ===== БЛОК 6. СТАРТ НОВОЙ ИГРЫ =====
   Выбирает фракцию бота (любая, кроме твоей), создаёт карту,
   две базы и 5 точек (4 боковые + Ядро в центре).
   pos(a,b) переводит «доли карты» в пиксели, а на вертикальном
   телефоне поворачивает карту: твоя база внизу, вражеская вверху. */
function start(fp,fp2){
 P=innerHeight>innerWidth;W=P?840:1440;H=P?1440:840;   // вертикальная карта = та же карта, повёрнутая, поэтому баланс не зависит от экрана
 const others=Object.keys(F).filter(k=>k!=fp);
 fac=[fp,fp2||others[Math.random()*2|0]];
 res=[F[fp].start,F[fac[1]].start];
 time=0;core=[0,0];fx=[];units=[];bots=[{buy:3,order:5},{buy:3,order:5}];botT=[0,1];lvl=[1,1];buildMode=false;cat=150;hintT=0;me=0;uid=0;snapT=0;
 const pos=(a,b)=>P?{x:b*W,y:(1-a)*H}:{x:a*W,y:b*H};
 let p=pos(.08,.5),q=pos(.92,.5);
 units.push(mk(0,p.x,p.y,{hp:5000,dmg:24,range:150,speed:0,rate:1},{r:28,base:1}));
 units.push(mk(1,q.x,q.y,{hp:5000,dmg:24,range:150,speed:0,rate:1},{r:28,base:1}));
 nodes=genNodes(pos);fgc.width=Math.ceil(W/FSC);fgc.height=Math.ceil(H/FSC);
 // кнопки найма юнитов твоей фракции
 $('buy').innerHTML='';
 mkBtns(fp);
 $('ov').style.display='none';running=true;ui();fit();camInit();
}
/* ===== ТУМАН ВОЙНЫ =====
   sources(t) — «глаза» команды t: [x, y, радиус обзора] от каждого её юнита (230), здания (260),
   базы (360) и захваченной точки (210). seenBy(S,x,y) — попадает ли точка в чей-то обзор.
   Чужие юниты вне обзора не рисуются и в онлайне даже не пересылаются сопернику (хозяин
   фильтрует снимок). Для точек запоминается последнее увиденное состояние (lo, lp).
   fgc — маленький холст тумана (в 8 раз меньше карты): тёмная заливка с вырезанными кругами обзора;
   при растяжении края получаются мягкими. fog=0 — туман выключен (кнопка в меню). */
const fgc=document.createElement('canvas'),fgx=fgc.getContext('2d'),FSC=8;
function sources(t){
 const a=[];units.forEach(u=>{if(u.team===t&&u.hp>0)a.push([u.x,u.y,u.base?360:u.bld?260:230])});
 nodes.forEach(n=>{if(n.o===t)a.push([n.x,n.y,210])});return a;
}
const seenBy=(S,x,y)=>S.some(q=>(q[0]-x)**2+(q[1]-y)**2<q[2]*q[2]);
/* ===== СЛУЧАЙНЫЕ ЗЕРКАЛЬНЫЕ ТОЧКИ =====
   genNodes(pos): 2 пары точек + Ядро в центре. Точка слева (a,b) получает «двойника» справа
   в (1-a,1-b) — зеркально через центр, поэтому у обоих игроков одинаковое расстояние до баз
   и друг до друга. Пробуем случайные места, пока точки не окажутся достаточно далеко от баз,
   Ядра и друг от друга; если не вышло — старая расстановка. */
function genNodes(pos){
 const bs=[pos(.08,.5),pos(.92,.5)],cr=pos(.5,.5);
 const mkn=(q,c)=>({x:q.x,y:q.y,r:c?44:32,o:null,p:0,core:c,lo:null,lp:0});
 for(let k=0;k<400;k++){
  const pts=[];
  [[.12,.42],[.58,.88]].forEach(r=>{const a=.2+Math.random()*.2,b=r[0]+Math.random()*(r[1]-r[0]);pts.push(pos(a,b),pos(1-a,1-b))});
  if(pts.every((q,i)=>dist(q,bs[0])>330&&dist(q,bs[1])>330&&dist(q,cr)>250&&pts.every((o,j)=>i===j||dist(q,o)>300)))
   return[...pts.map(q=>mkn(q,0)),mkn(cr,1)];
 }
 return[[.31,.25],[.31,.75],[.69,.25],[.69,.75]].map(a=>mkn(pos(a[0],a[1]),0)).concat([mkn(cr,1)]);
}
/* ===== КАМЕРА И МИНИ-КАРТА =====
   zMin() — самый далёкий масштаб (вся карта на экране); clampCam() — не даёт камере
   уехать за край мира; camTo() — задать масштаб так, чтобы точка мира (wx,wy) оказалась
   под точкой экрана (sx,sy); homePos() — где моя база; centerOn() — навести камеру;
   mmRect()/mmHit() — мини-карта в углу, тап по ней переносит камеру; mini() — её рисует. */
const zMin=()=>Math.min(cv.clientWidth/W,cv.clientHeight/H);
function clampCam(){
 const vw=cv.clientWidth/cam.z,vh=cv.clientHeight/cam.z;
 cam.x=W<=vw?(W-vw)/2:Math.max(0,Math.min(W-vw,cam.x));
 cam.y=H<=vh?(H-vh)/2:Math.max(0,Math.min(H-vh,cam.y));
}
function camTo(z,wx,wy,sx,sy){cam.z=Math.max(zMin(),Math.min(2.2,z));cam.x=wx-sx/cam.z;cam.y=wy-sy/cam.z;clampCam()}
const homePos=()=>P?{x:W/2,y:H*.92}:{x:W*.08,y:H/2};
function centerOn(p){cam.x=p.x-cv.clientWidth/cam.z/2;cam.y=p.y-cv.clientHeight/cam.z/2;clampCam()}
function camInit(){cam.z=Math.max(zMin(),zMin()*1.7);centerOn(homePos())}
function mmRect(){const s=Math.min(110/W,110/H);return{s,w:W*s,h:H*s,x:cv.clientWidth-W*s-6,y:6}}
function mmHit(e){
 const r=cv.getBoundingClientRect(),m=mmRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(x<m.x||x>m.x+m.w||y<m.y||y>m.y+m.h)return false;
 centerOn({x:(x-m.x)/m.s,y:(y-m.y)/m.s});return true;
}
function mini(){
 const m=mmRect();g.setTransform(DPR,0,0,DPR,0,0);   // рисуем в пикселях экрана
 g.fillStyle='rgba(0,0,0,.55)';g.fillRect(m.x,m.y,m.w,m.h);
 nodes.forEach(n=>{g.fillStyle=n.o===null?'#777777':F[fac[n.o]].c;g.fillRect(m.x+n.x*m.s-2,m.y+n.y*m.s-2,4,4)});
 units.forEach(u=>{if(u.hp<=0||(VS&&u.team!==me&&!u.base&&!seenBy(VS,u.x,u.y)))return;g.fillStyle=u.team===me?'#ffffff':'#f43f5e';const q=u.base?4:2;g.fillRect(m.x+u.x*m.s-q/2,m.y+u.y*m.s-q/2,q,q)});
 g.strokeStyle='#ffd54a';g.lineWidth=1;g.strokeRect(m.x+cam.x*m.s,m.y+cam.y*m.s,cv.clientWidth/cam.z*m.s,cv.clientHeight/cam.z*m.s);
}
/* mkBtns(): рисует кнопки найма для фракции fp. act(i): нажата кнопка номер i —
   гость отправляет приказ хозяину, остальные выполняют сразу. */
function mkBtns(fp){
 $('buy').innerHTML='';
 F[fp].u.forEach((d,i)=>{const b=document.createElement('button');
  b.innerHTML='<b>'+d.n+'</b><br>'+d.cost;b.onclick=()=>act(i);$('buy').appendChild(b)});
 $('fuse').style.display=fp=='bio'?'':'none';   // кнопка «Сращивание» только у био
}
function act(i){
 if(guest()){send({t:'b',i});return}
 const d=F[fac[me]].u[i];if(d.ult&&lvl[me]<2){say('Нужна база уровня 2');return}
 d.ritual?ritual(me,d):buy(me,d);
}
/* Подгоняет размер поля под экран, сохраняя пропорции */
function fit(){
 if(!W)return;
 const aw=innerWidth,ah=innerHeight-$('hud').offsetHeight-$('pn').offsetHeight-8;
 cv.style.width=aw+'px';cv.style.height=ah+'px';cv.width=aw*DPR;cv.height=ah*DPR;clampCam();
}
addEventListener('resize',fit);

/* ===== БЛОК 7. СОЗДАНИЕ ЮНИТОВ И НАЙМ =====
   mk() собирает бойца из «чертежа» d и стартовых полей:
   cd = таймер перезарядки, mx/my = точка, куда он идёт,
   tgt = цель приказа, stun = сколько секунд оглушён, sel = выбран ли. */
const mk=(team,x,y,d,extra)=>({...d,id:++uid,team,f:fac[team],x,y,r:9,max:d.hp,cd:0,mx:null,my:null,tgt:null,stun:0,sel:false,...extra});
/* buy(): списывает ресурс и ставит бойцов рядом со своей базой */
function buy(t,d){
 if(res[t]<d.cost||!canUlt(t,d))return;res[t]-=d.cost;
 const b=units[t];
 for(let i=0;i<(d.count||1);i++){
  const k=rnd(40,70),s=rnd(-40,40);
  units.push(mk(t,P?b.x+s:b.x+(t?-k:k),P?b.y+(t?k:-k):b.y+s,d,{gr:d.ritual?5:F[fac[t]].grow||0,r:d.ult?14:9})); // gr = секунд в коконе
 }
}

/* ===== БЛОК 7б. СПОСОБНОСТИ ФРАКЦИЙ =====
   ritual() — МАГИ: выбранный Послушник на ТВОЕЙ точке силы колдует 5 секунд (rit) и стоит на месте.
     Убьют его — ритуал сорван, ресурс потерян. Дочитал — появляется Дух (см. блок 9).
   fuse() — БИО: два выбранных юнита сливаются в гибрида: здоровье почти сумма, урон ×1.3.
     Гибрид повторно не сращивается (fz).
   cataclysm() — случайное событие для всех, раз в 150 секунд. */
function ritual(t,d){
 if(res[t]<d.cost||!canUlt(t,d))return;
 const a=units.find(u=>u.team===t&&u.hp>0&&u.n==='Послушник'&&!u.rit&&nodes.some(n=>n.o===t&&dist(u,n)<n.r+8));
 if(!a){say('Нужен Послушник на своей точке');return}
 res[t]-=d.cost;a.rit=5;a.rd=d;a.mx=null;a.tgt=null;
}
function fuse(t=me){
 if(guest()){send({t:'f'});return}
 if(!running||fac[t]!=='bio')return;
 const ok=u=>u.team===t&&!u.base&&!u.bld&&!u.fz&&!(u.gr>0)&&u.hp>0;   // кого можно сращивать
 let s=units.filter(u=>ok(u)&&u.sel);
 if(s.length<2)s=units.filter(ok);                          // выбрано меньше двух — берём всех своих
 if(s.length<2){say('Нужно минимум два юнита');return}
 let a=s[0],b=s[1],bd=1e9;
 for(const i of s)for(const j of s)if(i!==j&&dist(i,j)<bd){bd=dist(i,j);a=i;b=j}   // сращиваем ближайшую пару
 units=units.filter(u=>u!==a&&u!==b);
 units.push(mk(t,(a.x+b.x)/2,(a.y+b.y)/2,{hp:(a.hp+b.hp)*.9,dmg:Math.max(a.dmg,b.dmg)*1.3,range:Math.max(a.range,b.range),speed:(a.speed+b.speed)/2,rate:Math.min(a.rate,b.rate)},{r:13,fz:1,sel:t===me}));
}
function cataclysm(){
 const e=Math.random()*3|0;
 if(e===0){units.forEach(u=>{if(!u.base)u.hp-=u.max*.2});say('Кислотный дождь: −20% здоровья')}
 else if(e===1){units.forEach(u=>u.stun=2);say('Кибершторм: все оглушены на 2 с')}
 else{nodes.forEach(n=>{n.o=null;n.p=0});say('Астральный разлом: точки сброшены')}
}

/* ===== УРОВЕНЬ БАЗЫ И УЛЬТИМАТИВНЫЙ ЮНИТ =====
   upBase(): за UP ресурса база становится уровня 2 — открывается 4-й (ультимативный) юнит.
   canUlt(): можно ли нанять юнита d: обычного — всегда; ультимативного — только на уровне 2
   и только если такой уже не живёт, не вызревает в коконе и не вызывается ритуалом. */
function upBase(t=me){
 if(guest()){send({t:'u'});return}
 if(lvl[t]>=2){if(t===me)say('База уже улучшена');return}
 if(res[t]<UP){if(t===me)say('Нужно '+UP+' ресурса');return}
 res[t]-=UP;lvl[t]=2;if(t===me)say('База ур.2: открыт ультимативный юнит');
}
function canUlt(t,d){
 if(!d.ult)return true;if(lvl[t]<2)return false;
 return!units.some(u=>u.team===t&&u.hp>0&&(u.ult||(u.rit>0&&u.rd&&u.rd.ult)));
}

/* ===== ЗДАНИЯ НА ТОЧКАХ =====
   Кнопка «Здание» включает режим стройки: нажми на свою захваченную точку (кроме Ядра) — там
   вырастет здание фракции (3 секунды в «коконе»). На точке одно здание. place(t,i) строит команде t
   на точке номер i. Здание — юнит без движения (bld = вид, nd = его точка): враги могут его
   атаковать. Потеряешь точку — здание разрушится. Турель стреляет; гнездо (spw) каждые 10 с
   рождает бесплатный рой; храм даёт +6 к доходу и вдвое ускоряет ритуал рядом (sanctNear). */
function place(t,i){
 const n=nodes[i],b=F[fac[t]].bld;
 if(!n||n.core||n.o!==t||res[t]<b.cost||units.some(u=>u.bld&&u.nd===n&&u.hp>0)){if(t===me)say('Нужна своя свободная точка');return}
 res[t]-=b.cost;
 units.push(mk(t,n.x,n.y,{hp:b.hp,dmg:b.dmg,range:b.range,speed:0,rate:b.rate},{r:14,bld:b.k,nd:n,gr:3,sp:b.spawn||0,spw:b.spawn||0}));
}
const sanctNear=u=>units.some(b=>b.bld==='sanct'&&b.team===u.team&&b.hp>0&&!(b.gr>0)&&dist(b,u)<140);

/* ===== БЛОК 8. БОЙ И ДВИЖЕНИЕ ===== */
/* nearest(): ближайший враг в пределах reach (или null) */
function nearest(u,reach){
 let best=null,bd=1e9;
 for(const e of units){
  if(e.team===u.team||e.hp<=0)continue;
  const d=dist(u,e)-e.r;
  if(d<reach&&d<bd){best=e;bd=d}
 }
 return best;
}
/* step(): двигает юнита к точке (x,y); возвращает оставшееся расстояние */
function step(u,x,y,dt){
 const d=Math.hypot(x-u.x,y-u.y);if(d<2)return 0;
 const m=Math.min(d,u.speed*dt);u.x+=(x-u.x)/d*m;u.y+=(y-u.y)/d*m;return d-m;
}
/* hit(): удар. Урон цели, при splash — урон по соседям (60%),
   при zap — оглушение. Добавляет линию-вспышку выстрела. */
function hit(u,t){
 u.cd=u.rate;t.hp-=u.dmg;
 if(u.splash)units.forEach(e=>{if(e.team!==u.team&&e!==t&&dist(e,t)<u.splash)e.hp-=u.dmg*.6});
 if(u.zap)t.stun=u.zap;
 if(u.hack&&!t.base&&!t.bld&&!t.hj){t.hj=u.hack;t.team=u.team;t.tgt=null;t.mx=null;t.sel=false} // ВЗЛОМ: цель временно переходит на твою сторону
 fx.push({x:u.x,y:u.y,x2:t.x,y2:t.y,ttl:.15,c:F[u.f].c});
}
/* income(): доход команды t в секунду = (база + точки×бонус) × кривая времени */
function income(t){
 const f=F[fac[t]],k=nodes.filter(n=>n.o===t).length;
 return(f.base+k*f.node+units.filter(b=>b.team===t&&b.bld==='sanct'&&b.hp>0&&!(b.gr>0)).length*6)*f.curve(time)*(t&&!online?[.8,1,1.3][diff]:1); // у бота доход зависит от сложности
}

/* onSlime(): юнит стоит на «слизи» — в 180 пикселях от своей базы или у своей захваченной точки.
   Био-юниты там лечатся в 2.5 раза быстрее (множитель slime в данных фракции). */
function onSlime(u){return dist(u,units[u.team])<180||nodes.some(n=>n.o===u.team&&dist(u,n)<n.r+60)}
/* botThink(): «мозг» бота команды t. Каждые пару секунд покупает юнитов (чаще самых дорогих
   из доступных), раз в 5 секунд раздаёт приказы: есть враг у базы — все защищать;
   армия большая — штурм базы врага; иначе — захват ближайшей чужой точки. */
function botThink(t,dt){
 const B=bots[t];B.buy-=dt;B.order-=dt;
 if(B.buy<=0){B.buy=[3.5,2.5,1.8][diff];
  const bd=F[fac[t]].bld,fn=nodes.findIndex(n=>!n.core&&n.o===t&&!units.some(u=>u.bld&&u.nd===n&&u.hp>0));
  const army=units.filter(u=>u.team===t&&!u.base&&!u.bld).length;
  let save=0;                                          // сколько бот копит: сначала здание (с 1:30), потом улучшение базы (с 2:30)
  if(fn>=0&&time>90)save=bd.cost;else if(lvl[t]<2&&time>150)save=UP;
  if(save&&res[t]>=save){if(save===UP)upBase(t);else place(t,fn)}
  else if(!(save&&army>=5)){                           // копит, только если армия уже есть
   const o=F[fac[t]].u.filter(d=>d.cost<=res[t]&&canUlt(t,d));
   if(o.length)buy(t,Math.random()<.6?o[o.length-1]:o[Math.random()*o.length|0]);
  }
 }
 if(B.order<=0){B.order=5;
  const army=units.filter(u=>u.team===t&&!u.base&&!u.bld);
  if(fac[t]==='bio'&&army.filter(u=>!u.fz&&!(u.gr>0)).length>=2)fuse(t);   // био-бот сращивает юнитов
  const th=units.find(e=>e.team!==t&&!e.base&&e.hp>0&&dist(e,units[t])<260);
  army.forEach(u=>{
   if(th){u.mx=th.x;u.my=th.y;return}
   if(u.mx!=null)return;
   if(army.length>=[10,8,6][diff]){u.mx=units[1-t].x;u.my=units[1-t].y}
   else{const n=nodes.filter(n=>n.o!==t&&!(n.core&&time<240)).sort((a,b)=>dist(u,a)-dist(u,b))[0];
    if(n){u.mx=n.x+rnd(-15,15);u.my=n.y+rnd(-15,15)}}
  });
 }
}

/* ===== БЛОК 9. ГЛАВНЫЙ ШАГ ИГРЫ =====
   Вызывается ~60 раз в секунду. dt = сколько секунд прошло с прошлого кадра. */
function update(dt){
 hintT-=dt;
 if(time>=cat){cat+=150;cataclysm()}                 // катаклизм раз в 150 с
 time+=dt;
 res[0]+=income(0)*dt;res[1]+=income(1)*dt;          // 1) доход

 nodes.forEach(n=>{                                   // 2) захват точек
  if(n.core&&time<240)return;   // Ядро закрыто до 4:00
  let a=0,b=0;
  units.forEach(u=>{if(!u.base&&!u.bld&&u.hp>0&&dist(u,n)<n.r+8)u.team?b++:a++});
  if(a&&!b)n.p=Math.min(1,n.p+dt*.12*Math.min(a,4)); // p от -1 (бот) до +1 (ты)
  else if(b&&!a)n.p=Math.max(-1,n.p-dt*.12*Math.min(b,4));
  if(n.o===0&&n.p<=0)n.o=null;
  if(n.o===1&&n.p>=0)n.o=null;
  if(n.p>=1)n.o=0;if(n.p<=-1)n.o=1;
 });
 units.forEach(b=>{if(b.bld&&b.hp>0&&b.nd.o!==b.team)b.hp=0});   // потеряли точку — здание разрушено
 const c=nodes[4];                                    // 3) таймер Ядра
 core[0]=c.o===0?core[0]+dt:0;core[1]=c.o===1?core[1]+dt:0;

 units.forEach(u=>{                                   // 4) поведение каждого юнита
  if(u.hp<=0)return;
  if(u.hj!=null&&(u.hj-=dt)<=0){u.hj=null;u.team=1-u.team;u.tgt=null;u.mx=null} // взлом кончился — юнит возвращается
  if(u.life!=null&&(u.life-=dt)<=0)u.hp=0;            // духи исчезают по таймеру
  if(F[u.f].regen&&!u.base)u.hp=Math.min(u.max,u.hp+u.max*F[u.f].regen*(1+time/180)*(onSlime(u)?F[u.f].slime:1)*dt); // самолечение био: % здоровья в секунду, растёт со временем, на слизи ×2.5 // самолечение био
  if(u.gr>0){u.gr-=dt;return}                         // кокон: юнит ещё вызревает
  if(u.rit>0){if((u.rit-=dt*(sanctNear(u)?2:1))<=0)units.push(mk(u.team,u.x+14,u.y,u.rd,{gr:0,r:u.rd.ult?14:9}));return} // ритуал: Дух появится, когда жрец дочитает
  if(u.stun>0){u.stun-=dt;return}                     // оглушённый стоит
  u.cd-=dt;
  if(u.spw&&(u.sp-=dt)<=0){u.sp=u.spw;const d=F[u.f].u[0];for(let k=0;k<(d.count||1);k++)units.push(mk(u.team,u.x+rnd(-24,24),u.y+rnd(-24,24),d,{gr:1}))}   // гнездо рождает рой
  // цель: приказ игрока важнее; иначе ближайший враг (стоящий юнит замечает дальше)
  let t=u.tgt&&u.tgt.hp>0?u.tgt:(u.tgt=null,nearest(u,u.range+(u.mx==null?80:0)));
  if(t&&dist(u,t)-t.r<=u.range){if(u.cd<=0)hit(u,t)}  // в зоне удара — бьём
  else if(t&&u.speed&&u.mx==null)step(u,t.x,t.y,dt);  // иначе догоняем
  if(u.mx!=null&&u.speed&&step(u,u.mx,u.my,dt)<3)u.mx=null; // идём по приказу
 });
 units=units.filter(u=>u.hp>0||u.base);               // 5) убираем погибших (базы остаются)
 fx=fx.filter(f=>(f.ttl-=dt)>0);

 // 6) БОТ(Ы): botT[t]=1 — командой t управляет бот (в тесте баланса — обеими)
 if(!online)botT.forEach((on,t)=>{if(on)botThink(t,dt)});

 // 7) УСЛОВИЯ ПОБЕДЫ: bw/cw = номер победившей команды (или -1)
 const bw=units[0].hp<=0?1:units[1].hp<=0?0:-1,cw=core[0]>=120?0:core[1]>=120?1:-1;
 if(bw>=0||cw>=0)finish(bw>=0?bw:cw,bw>=0?'База уничтожена.':'Вознесение: Ядро удержано.');
 if(online)snap();   // 8) онлайн: хозяин рассылает состояние гостю
}

/* ===== БЛОК 10. РИСОВАНИЕ =====
   Каждый кадр поле стирается и рисуется заново: сетка, точки, юниты, эффекты.
   Форма юнита = фракция: квадрат — техно, круг — био, треугольник — маги. */
function draw(){
 g.setTransform(1,0,0,1,0,0);g.fillStyle='#0b0d12';g.fillRect(0,0,cv.width,cv.height);   // фон за краем мира
 g.setTransform(cam.z*DPR,0,0,cam.z*DPR,-cam.x*cam.z*DPR,-cam.y*cam.z*DPR);              // включаем камеру
 g.fillStyle='#10131a';g.fillRect(0,0,W,H);
 VS=fog?sources(me):null;                               // обзор моей команды на этот кадр
 const real=nodes.map(n=>[n.o,n.p]);                    // хозяин: невидимые точки показываем по последним данным
 if(VS&&!guest())nodes.forEach(n=>{if(n.o===me||seenBy(VS,n.x,n.y)){n.lo=n.o;n.lp=n.p}else{n.o=n.lo;n.p=n.lp}});
 [0,1].forEach(t=>{                                    // зелёная «слизь» био: зоны быстрого лечения
  if(!F[fac[t]].slime)return;const c=F[fac[t]].c+'18',b=units.find(u=>u.base&&u.team===t);
  if(b){g.beginPath();g.arc(b.x,b.y,180,0,7);g.fillStyle=c;g.fill()}
  nodes.forEach(n=>{if(n.o===t){g.beginPath();g.arc(n.x,n.y,n.r+60,0,7);g.fillStyle=c;g.fill()}});
 });
 g.strokeStyle='#1a1f2c';g.lineWidth=1;
 for(let x=0;x<W;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
 for(let y=0;y<H;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
 if(hintT>0){g.fillStyle='#ffd54a';g.font=(14/cam.z)+'px sans-serif';g.textAlign='center';g.fillText(hint,cam.x+cv.clientWidth/cam.z/2,cam.y+30/cam.z)} // подсказки и катаклизмы
 if(dr&&dr.on){g.strokeStyle='#ffd54a';g.lineWidth=1;g.strokeRect(dr.x,dr.y,dr.x2-dr.x,dr.y2-dr.y)} // рамка выделения
 nodes.forEach(n=>{                                   // точки силы
  const col=n.o===null?'#777777':F[fac[n.o]].c;
  g.beginPath();g.arc(n.x,n.y,n.r,0,7);g.fillStyle=col+'33';g.fill();
  g.strokeStyle=col;g.lineWidth=3;g.stroke();
  g.beginPath();g.arc(n.x,n.y,n.r-6,-1.57,-1.57+Math.abs(n.p)*6.28); // дуга захвата
  g.strokeStyle=n.p>0?F[fac[0]].c:F[fac[1]].c;g.stroke();
  if(n.core){g.fillStyle='#fff';g.font='12px sans-serif';g.textAlign='center';g.fillText(time<240?'ЯДРО '+fmt(240-time):'ЯДРО',n.x,n.y+4)}
 });
 if(VS){fgx.globalCompositeOperation='source-over';fgx.fillStyle='rgba(4,6,10,.7)';fgx.fillRect(0,0,fgc.width,fgc.height);
  fgx.globalCompositeOperation='destination-out';fgx.fillStyle='#000';
  VS.forEach(q=>{fgx.beginPath();fgx.arc(q[0]/FSC,q[1]/FSC,q[2]/FSC,0,7);fgx.fill()});
  g.imageSmoothingEnabled=true;g.drawImage(fgc,0,0,W,H)}   // тёмная пелена с вырезанным обзором
 if(buildMode)nodes.forEach(n=>{                        // подсветка точек, куда можно построить
  if(!n.core&&n.o===me&&!units.some(u=>u.bld&&dist(u,n)<8)){g.beginPath();g.arc(n.x,n.y,n.r+10,0,7);g.strokeStyle='#ffd54a';g.lineWidth=3;g.stroke()}});
 units.forEach(u=>{                                   // юниты и базы
  if(u.hp<=0)return;
  if(VS&&u.team!==me&&!u.base&&!seenBy(VS,u.x,u.y))return;   // чужие в тумане не видны
  const c=F[u.f].c,r=u.r;
  g.beginPath();
  if(u.base||u.f=='techno')g.rect(u.x-r,u.y-r,r*2,r*2);
  else if(u.f=='bio')g.arc(u.x,u.y,r,0,7);
  else{g.moveTo(u.x,u.y-r-2);g.lineTo(u.x+r,u.y+r);g.lineTo(u.x-r,u.y+r);g.closePath()}
  g.globalAlpha=u.gr>0?.4:1;g.fillStyle=c;g.fill();g.globalAlpha=1;   // кокон полупрозрачный
  if(u.rit>0){g.beginPath();g.arc(u.x,u.y,r+8,0,7);g.strokeStyle=c;g.lineWidth=2;g.stroke()} // кольцо ритуала
  if(u.bld){g.fillStyle='#fff';g.font='12px sans-serif';g.textAlign='center';g.fillText(u.bld==='tur'?'Т':u.bld==='nest'?'Г':'С',u.x,u.y+4);
   if(u.spw&&!(u.gr>0)){g.beginPath();g.arc(u.x,u.y,r+6,-1.57,-1.57+6.28*(1-u.sp/u.spw));g.strokeStyle='#84cc16';g.lineWidth=2;g.stroke()}}   // кольцо до следующего роя
  if(u.team===me){g.strokeStyle='#fff';g.lineWidth=2;g.stroke()}else{g.strokeStyle='#f43f5e';g.lineWidth=2;g.stroke()} // свои — белая кайма, чужие — красная   // твои — с белой каймой
  if(u.sel){g.beginPath();g.arc(u.x,u.y,r+5,0,7);g.strokeStyle='#ffd54a';g.lineWidth=2;g.stroke()}
  if(u.stun>0){g.fillStyle='#ffd54a';g.fillText('⚡',u.x,u.y-r-8)}
  if(u.hp<u.max||u.base){g.fillStyle='#000';g.fillRect(u.x-r,u.y-r-7,r*2,3);
   g.fillStyle='#4ade80';g.fillRect(u.x-r,u.y-r-7,r*2*u.hp/u.max,3)}
  if(u.base){g.fillStyle='#fff';g.font='11px sans-serif';g.textAlign='center';g.fillText(u.team===me?'ТЫ':online?'ВРАГ':'БОТ',u.x,u.y+4)}
 });
 fx.forEach(f=>{                                      // вспышки выстрелов и метки приказов
  if(VS&&f.x2!==undefined&&!seenBy(VS,f.x,f.y)&&!seenBy(VS,f.x2,f.y2))return;
  g.globalAlpha=Math.min(1,f.ttl*4);g.strokeStyle=f.c||'#fff';g.lineWidth=2;g.beginPath();
  if(f.x2===undefined)g.arc(f.x,f.y,(.4-f.ttl)*60,0,7);else{g.moveTo(f.x,f.y);g.lineTo(f.x2,f.y2)}
  g.stroke();g.globalAlpha=1;
 });
 mini();   // мини-карта в углу
 nodes.forEach((n,i)=>{n.o=real[i][0];n.p=real[i][1]});   // вернуть настоящие данные точек
}

/* ===== БЛОК 11. ПАНЕЛЬ СВЕРХУ И КНОПКИ =====
   Обновляет текст ресурсов/времени и блокирует кнопки, если не хватает денег. */
function ui(){
 $('hud').textContent=F[fac[me]].res+': '+(res[me]|0)+' (+'+income(me).toFixed(1)+'/с) · '+fmt(time)+
  ' · Ядро: ты '+(core[me]|0)+'/120, враг '+(core[1-me]|0)+'/120 · враг: '+F[fac[1-me]].n;
 [...$('buy').children].forEach((b,i)=>{
  const d=F[fac[me]].u[i],lock=d.ult&&lvl[me]<2,h='<b>'+d.n+'</b><br>'+d.cost+(lock?' 🔒':'');
  if(b._h!==h){b._h=h;b.innerHTML=h}b.disabled=res[me]<d.cost||lock});
 const up=$('up');up.textContent=lvl[me]>=2?'База: ур.2':'База ↑ '+UP;up.disabled=lvl[me]>=2||res[me]<UP;
 const bd=F[fac[me]].bld,bb=$('bld');bb.textContent=buildMode?'Отмена':bd.s+' '+bd.cost;bb.disabled=!buildMode&&res[me]<bd.cost;
}

/* ===== БЛОК 12. УПРАВЛЕНИЕ (касания и клики) =====
   Тап по своему юниту — выбрать/снять. Тап по земле — выбранные идут туда.
   Тап по врагу — выбранные его атакуют. */
/* setSel(): выбрать/снять выбор юнита (номер запоминаем для гостя).
   order(): приказ — гость шлёт хозяину (с зеркалом координат), остальные выполняют.
   doOrder(): сам приказ команды t: ids — кому, fid — цель-враг (0 — нет), x,y — точка. */
function setSel(u,v){u.sel=v;v?selIds.add(u.id):selIds.delete(u.id)}
function order(ids,fid,x,y){
 if(guest()){const q=fl(x,y);send({t:'o',ids,fid,x:q[0],y:q[1]});return}
 doOrder(me,ids,fid,x,y);
}
function doOrder(t,ids,fid,x,y){
 const foe=fid?units.find(u=>u.id===fid):null;
 units.forEach(u=>{if(u.team!==t||!ids.includes(u.id))return;
  if(foe){u.tgt=foe;u.mx=null}else{u.tgt=null;u.mx=x+rnd(-18,18);u.my=y+rnd(-18,18)}});
}
function tap(e){
 if(!running)return;
 const p=pt(e);   // экран → координаты мира
 if(buildMode){                                         // режим стройки: тап по своей свободной точке
  buildMode=false;const i=nodes.findIndex(n=>!n.core&&n.o===me&&dist(n,p)<n.r+24);
  if(i<0){say('Нужна своя свободная точка');return}
  if(guest())send({t:'p',i});else place(me,i);return;
 }
 const mine=units.find(u=>u.team===me&&!u.base&&!u.bld&&u.hp>0&&dist(u,p)<22/Math.min(1,cam.z));
 if(mine){setSel(mine,!mine.sel);return}
 const foe=units.find(u=>u.team!==me&&u.hp>0&&(u.base||!VS||seenBy(VS,u.x,u.y))&&dist(u,p)<u.r+14/Math.min(1,cam.z));
 order(units.filter(u=>u.sel&&u.team===me).map(u=>u.id),foe?foe.id:0,p.x,p.y);
 fx.push({x:p.x,y:p.y,ttl:.4});                       // метка на месте тапа
}
/* Рамка выделения: зажми палец на пустом месте и протяни — выберутся все твои юниты внутри.
   Короткое касание (без протяжки) работает как раньше — это функция tap() выше. */
let dr=null;   // dr = тап/рамка одним пальцем {id — номер пальца; x,y — начало; x2,y2 — конец (в мире); sx,sy — начало на экране; on — тянется ли рамка}
const ptr=new Map();   // активные касания: номер пальца → позиция на экране
let pinch=null;        // жест двумя пальцами {d — расстояние между пальцами; mx,my — середина; on — это уже именно щипок}
const pt=e=>{const r=cv.getBoundingClientRect();return{x:cam.x+(e.clientX-r.left)/cam.z,y:cam.y+(e.clientY-r.top)/cam.z}};
/* Правила, чтобы быстрые тапы не путались со щипком:
   • тап = палец коснулся и отпущен, почти не сдвинувшись (до 18 пикселей);
   • второй палец сам по себе щипок НЕ запускает — только когда пальцы реально поехали (на 14+ пикселей);
     пока щипок не начался, первый палец остаётся обычным тапом и приказ не теряется;
   • пустая рамка (без своих юнитов внутри) выделение не сбрасывает;
   • когда все пальцы убраны (touchend), список касаний очищается — «застрявших» пальцев не бывает. */
cv.addEventListener('pointerdown',e=>{
 if(!running)return;
 cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===2){const a=[...ptr.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,on:0};return}
 if(ptr.size>2||mmHit(e))return;
 dr={...pt(e),id:e.pointerId,sx:e.clientX,sy:e.clientY,on:0};
});
cv.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptr.size>=2){
  const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
  if(!pinch.on){if(Math.abs(d-pinch.d)<14&&Math.hypot(mx-pinch.mx,my-pinch.my)<14)return;pinch.on=1;dr=null}   // пальцы реально поехали — это щипок
  const r=cv.getBoundingClientRect(),wx=cam.x+(pinch.mx-r.left)/cam.z,wy=cam.y+(pinch.my-r.top)/cam.z;
  camTo(cam.z*d/pinch.d,wx,wy,mx-r.left,my-r.top);pinch.d=d;pinch.mx=mx;pinch.my=my;return;
 }
 if(!dr){mmHit(e);return}
 if(e.pointerId!==dr.id)return;
 const p=pt(e);dr.x2=p.x;dr.y2=p.y;
 if(Math.hypot(e.clientX-dr.sx,e.clientY-dr.sy)>18)dr.on=1;
});
const upPtr=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=null};
cv.addEventListener('pointercancel',e=>{upPtr(e);if(dr&&dr.id===e.pointerId)dr=null});
cv.addEventListener('pointerup',e=>{
 upPtr(e);
 if(!dr||e.pointerId!==dr.id)return;const d=dr;dr=null;
 if(!d.on){tap(e);return}                              // не протягивали — обычный тап
 const x1=Math.min(d.x,d.x2),x2=Math.max(d.x,d.x2),y1=Math.min(d.y,d.y2),y2=Math.max(d.y,d.y2);
 const inside=units.filter(u=>u.team===me&&!u.base&&!u.bld&&u.hp>0&&u.x>=x1&&u.x<=x2&&u.y>=y1&&u.y<=y2);
 if(!inside.length)return;                             // пустая рамка — выделение не трогаем
 units.forEach(u=>{if(u.team===me&&!u.base&&!u.bld)setSel(u,inside.includes(u))});
});
['touchend','touchcancel'].forEach(t=>document.addEventListener(t,e=>{if(e.touches.length===0){ptr.clear();pinch=null}},{passive:true}));
cv.addEventListener('wheel',e=>{
 e.preventDefault();const r=cv.getBoundingClientRect(),p=pt(e);
 camTo(cam.z*(e.deltaY<0?1.15:1/1.15),p.x,p.y,e.clientX-r.left,e.clientY-r.top);
},{passive:false});
/* «Все войска»: выбирает всех твоих бойцов, повторное нажатие — снимает выбор */
$('fuse').onclick=()=>fuse();
$('up').onclick=()=>upBase();
$('bld').onclick=()=>{buildMode=!buildMode;if(buildMode)say('Нажми на свою захваченную точку')};
$('home').onclick=()=>centerOn(homePos());   // камера к своей базе
$('all').onclick=()=>{
 if(!running)return;
 const a=units.filter(u=>u.team===me&&!u.base&&!u.bld);
 const on=a.some(u=>!u.sel);a.forEach(u=>setSel(u,on));
};

/* ===== БЛОК 14. ОНЛАЙН 1v1 (PeerJS: игроки соединяются напрямую, свой сервер не нужен) =====
   Хозяин (команда 0) ведёт всю игру и ~12 раз в секунду шлёт гостю «снимок» мира (snap).
   Гость (команда 1) только рисует снимки (onSnap) и шлёт хозяину приказы.
   fl() зеркалит поле для гостя, чтобы его база тоже была «своей» (снизу/слева). */
const fl=(x,y)=>me?[W-x,H-y]:[x,y];
let joinCode='';
const ovMsg=t=>{$('ov').style.display='flex';$('ov').innerHTML='<div class="box"><h2>'+t+'</h2><button onclick="location.reload()">Отмена</button></div>'};
function setMode(m){mode=m;if(m==='join'){joinCode=(prompt('Код комнаты (4 буквы)')||'').trim().toUpperCase();if(!joinCode)mode='solo'}menu()}
function pick(k){if(mode==='host')hostRoom(k);else if(mode==='join')joinRoom(k);else{online=0;start(k)}}
/* Хозяин: создаёт комнату с кодом, ждёт гостя, по его «hi» запускает матч и шлёт «go». */
function hostRoom(k){
 const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
 ovMsg('Код комнаты: <b>'+code+'</b><br>Отправь код другу и жди...');
 peer=new Peer('anomaly-'+code);
 peer.on('error',e=>ovMsg('Ошибка связи: '+e.type));
 peer.on('connection',c=>{conn=c;
  c.on('data',m=>{
   if(m.t==='hi'){online=1;start(k,m.f);send({t:'go',W,H,P,fog,fac,nodes:nodes.map(n=>[n.x,n.y,n.r,n.core])})}
   else if(m.t==='o')doOrder(1,m.ids,m.fid,m.x,m.y);
   else if(m.t==='b'){const d=F[fac[1]].u[m.i];if(d)d.ritual?ritual(1,d):buy(1,d)}
   else if(m.t==='f')fuse(1);
   else if(m.t==='u')upBase(1);
   else if(m.t==='p')place(1,m.i);
  });
  c.on('close',()=>{if(running)end(true,'Соперник вышел.')});
 });
}
/* Гость: подключается по коду, сообщает свою фракцию, дальше слушает хозяина. */
function joinRoom(k){
 ovMsg('Подключаемся к комнате '+joinCode+'...');
 peer=new Peer();
 peer.on('error',e=>ovMsg('Ошибка связи: '+e.type+'. Проверь код.'));
 peer.on('open',()=>{
  conn=peer.connect('anomaly-'+joinCode,{serialization:'json'});
  conn.on('open',()=>send({t:'hi',f:k}));
  conn.on('data',m=>{if(m.t==='go')guestGo(m);else if(m.t==='s')onSnap(m);else if(m.t==='e')end(m.w===me,m.why)});
  conn.on('close',()=>{if(running)end(true,'Соперник вышел.')});
 });
}
/* guestGo(): гость получил карту и фракции — готовит экран */
function guestGo(m){
 me=1;online=1;P=m.P;W=m.W;H=m.H;fog=m.fog;fgc.width=Math.ceil(W/FSC);fgc.height=Math.ceil(H/FSC);fac=m.fac;
 nodes=m.nodes.map(a=>{const q=fl(a[0],a[1]);return{x:q[0],y:q[1],r:a[2],o:null,p:0,core:a[3]}});
 units=[];fx=[];res=[0,0];core=[0,0];time=0;hintT=0;selIds.clear();lvl=[1,1];buildMode=false;
 mkBtns(fac[1]);$('ov').style.display='none';running=true;ui();fit();camInit();
}
/* snap(): хозяин упаковывает мир в компактные массивы и шлёт гостю (не чаще 12 раз/с) */
function snap(){
 const n=performance.now();if(n-snapT<80)return;snapT=n;const S1=fog?sources(1):null;   // что видит гость
 send({t:'s',l:lvl,tm:time,r:[res[0]|0,res[1]|0],c:[core[0]|0,core[1]|0],h:hintT>0?hint:'',
  n:nodes.map(a=>(!S1||a.o===1||seenBy(S1,a.x,a.y))?[a.o,Math.round(a.p*100)/100]:0),
  u:units.filter(u=>u.hp>0&&(!S1||u.team===1||u.base||seenBy(S1,u.x,u.y))).map(u=>[u.id,u.team,u.f,Math.round(u.x),Math.round(u.y),Math.round(u.hp),Math.round(u.max),u.r,u.base?1:0,u.gr>0?1:0,u.rit>0?1:0,u.stun>0?1:0,u.fz?1:0,u.bld||0]),
  x:fx.filter(f=>f.x2!==undefined&&(!S1||seenBy(S1,f.x,f.y)||seenBy(S1,f.x2,f.y2))).map(f=>[Math.round(f.x),Math.round(f.y),Math.round(f.x2),Math.round(f.y2),f.c])});
}
/* onSnap(): гость превращает снимок обратно в юнитов/точки/эффекты (с зеркалом координат) */
function onSnap(m){
 time=m.tm;res=m.r;core=m.c;lvl=m.l;
 units=m.u.map(a=>{const q=fl(a[3],a[4]);return{id:a[0],team:a[1],f:a[2],x:q[0],y:q[1],hp:a[5],max:a[6],r:a[7],base:a[8],gr:a[9],rit:a[10],stun:a[11],fz:a[12],bld:a[13],sel:selIds.has(a[0])}});
 nodes.forEach((n,i)=>{const d=m.n[i];if(d){n.o=d[0];n.p=d[1]}});   // не видим точку — помним прежнее
 fx=m.x.map(a=>{const p=fl(a[0],a[1]),q=fl(a[2],a[3]);return{x:p[0],y:p[1],x2:q[0],y2:q[1],ttl:.15,c:a[4]}});
 if(m.h&&m.h!==hint)say(m.h);
}
/* finish(): матч закончен, победила команда w. Хозяин сообщает гостю и показывает итог себе */
function finish(w,why){if(online)send({t:'e',w,why});end(w===me,why)}

/* ===== БЛОК 15. ТЕСТ БАЛАНСА (кнопка в меню) =====
   Боты играют друг с другом без рисования, ускоренно, по всем парам фракций (N партий на пару,
   по очереди слева и справа). Потом показывается, кто сколько выиграл, чем кончаются партии
   (базой или Ядром) и сколько они длятся. Это грубый ориентир: боты не умеют микроконтроль. */
function simTest(N){
 const fs=Object.keys(F),pairs=[];fs.forEach(a=>fs.forEach(b=>{if(a!==b)pairs.push([a,b])}));
 const w={},pr={},rs={base:0,core:0,none:0},du=[];fs.forEach(f=>w[f]=0);pairs.forEach(p=>pr[p.join('>')]=0);
 const tot=pairs.length*N;let n=0;
 const step=()=>{
  if(n>=tot){
   du.sort((a,b)=>a-b);const per=N*4;
   $('ov').innerHTML='<div class="box"><h2>Результаты теста баланса</h2>'+
    fs.map(f=>'<p><b>'+F[f].n+'</b>: '+w[f]+' из '+per+' ('+Math.round(w[f]/per*100)+'%)</p>').join('')+
    '<p>Ориентир: около 33% у каждой — ровно; ниже 20% или выше 50% — перекос.</p>'+
    '<p>Конец партии: базой '+rs.base+', Ядром '+rs.core+', без итога '+rs.none+'. Средняя длина партии: '+fmt(du[du.length>>1])+'.</p>'+
    pairs.map(p=>'<p style="font-size:12px">'+F[p[0]].n+' (слева) против '+F[p[1]].n+': слева выиграл '+pr[p.join('>')]+' из '+N+'</p>').join('')+
    '<button onclick="menu(\'\')">Назад в меню</button></div>';
   return;
  }
  const a=pairs[n%pairs.length][0],b=pairs[n%pairs.length][1];   // пары идут по кругу
  online=0;diff=1;start(a,b);botT=[1,1];
  while(running&&time<1500)update(.1);
  const bw=units[0].hp<=0?1:units[1].hp<=0?0:-1,cw=core[0]>=120?0:core[1]>=120?1:-1,x=bw>=0?bw:cw;
  if(x<0)rs.none++;else{rs[bw>=0?'base':'core']++;w[fac[x]]++;if(x===0)pr[a+'>'+b]++}
  running=false;du.push(time);n++;
  $('ov').style.display='flex';$('ov').innerHTML='<div class="box"><h2>Тест баланса</h2><p>Боты играют сами: '+n+' из '+tot+'</p></div>';
  setTimeout(step,0);
 };
 step();
}

/* Запрет жестов приближения всей страницы (двойной тап по кнопкам и щипок вне поля) */
document.addEventListener('dblclick',e=>e.preventDefault());
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));

/* ===== БЛОК 13. ЗАПУСК =====
   Бесконечный цикл: считаем шаг игры, рисуем, показываем панель. */
let last=0;
function loop(ts){
 const dt=Math.min(.05,(ts-last)/1000);last=ts;
 if(running){if(guest()){hintT-=dt;draw();ui()}else{update(dt);if(running){draw();ui()}}}
 requestAnimationFrame(loop);
}
menu();requestAnimationFrame(loop);
</script>
</body>
